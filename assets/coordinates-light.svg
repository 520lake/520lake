<svg xmlns="http://www.w3.org/2000/svg" width="440" height="112" viewBox="0 0 440 112" role="img" aria-label="坐标移动">
  <defs>
    <style>
      @keyframes walk {
        0%   { transform: translate(40px, 80px); }
        25%  { transform: translate(120px, 80px); }
        50%  { transform: translate(120px, 48px); }
        75%  { transform: translate(200px, 48px); }
        100% { transform: translate(200px, 16px); }
      }
      @keyframes blink {
        0%   { opacity: 1; }
        96%  { opacity: 1; }
        100% { opacity: 0; }
      }
      .marker { animation: walk 8s linear infinite, blink 8s linear infinite; }
      .l0 { animation: s0 8s steps(1) infinite; }
      .l1 { animation: s1 8s steps(1) infinite; }
      .l2 { animation: s2 8s steps(1) infinite; }
      .l3 { animation: s3 8s steps(1) infinite; }
      @keyframes s0 { 0% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      @keyframes s1 { 0% {opacity:0} 25% {opacity:1} 50% {opacity:0} 100% {opacity:0} }
      @keyframes s2 { 0% {opacity:0} 50% {opacity:1} 75% {opacity:0} 100% {opacity:0} }
      @keyframes s3 { 0% {opacity:0} 75% {opacity:1} 100% {opacity:0} }
    </style>
  </defs>

  <!-- 网格 -->
  <g stroke="#e5dfd6" stroke-width="1">
    <line x1="40" y1="16" x2="400" y2="16"/>
    <line x1="40" y1="48" x2="400" y2="48"/>
    <line x1="40" y1="80" x2="400" y2="80"/>
    <line x1="40" y1="16" x2="40" y2="80"/>
    <line x1="120" y1="16" x2="120" y2="80"/>
    <line x1="200" y1="16" x2="200" y2="80"/>
    <line x1="280" y1="16" x2="280" y2="80"/>
    <line x1="400" y1="16" x2="400" y2="80"/>
  </g>

  <!-- 路径 -->
  <polyline points="40,80 120,80 120,48 200,48 200,16" fill="none"
            stroke="#8b4513" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 坐标读数 -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b4513" letter-spacing="1">
    <text class="l0" x="300" y="38">(0, 0)</text>
    <text class="l1" x="300" y="38">(1, 0)</text>
    <text class="l2" x="300" y="38">(1, 1)</text>
    <text class="l3" x="300" y="38">(2, 1)</text>
  </g>
  <text x="300" y="56" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="8"
        letter-spacing="1.4" fill="#b3a795">POSITION</text>

  <!-- 移动的坐标点 -->
  <g class="marker">
    <circle r="7" fill="none" stroke="#8b4513" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="2.8" fill="#8b4513"/>
  </g>
</svg>
