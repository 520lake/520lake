<svg xmlns="http://www.w3.org/2000/svg" width="440" height="112" viewBox="0 0 440 112" role="img" aria-label="cursor moving across a coordinate grid">
  <defs>
    <style>
      .cursor { animation: walk 12s cubic-bezier(.42,0,.28,1) infinite; }
      @keyframes walk {
        0%     { transform: translate(40px, 80px); }
        12.5%  { transform: translate(120px, 80px); }
        25%    { transform: translate(120px, 48px); }
        37.5%  { transform: translate(200px, 48px); }
        50%    { transform: translate(200px, 16px); }
        62.5%  { transform: translate(200px, 48px); }
        75%    { transform: translate(120px, 48px); }
        87.5%  { transform: translate(120px, 80px); }
        100%   { transform: translate(40px, 80px); }
      }
      .k { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: steps(1); }
      .k0 { animation-name: n0; } .k1 { animation-name: n1; } .k2 { animation-name: n2; }
      .k3 { animation-name: n3; } .k4 { animation-name: n4; }
      @keyframes n0 { 0% {opacity:1} 12.5% {opacity:0} 99% {opacity:0} 100% {opacity:1} }
      @keyframes n1 { 0% {opacity:0} 12.5% {opacity:1} 25% {opacity:0} 87.5% {opacity:1} 99% {opacity:0} 100% {opacity:0} }
      @keyframes n2 { 0% {opacity:0} 25% {opacity:1} 37.5% {opacity:0} 75% {opacity:1} 87.5% {opacity:0} 100% {opacity:0} }
      @keyframes n3 { 0% {opacity:0} 37.5% {opacity:1} 50% {opacity:0} 62.5% {opacity:1} 75% {opacity:0} 100% {opacity:0} }
      @keyframes n4 { 0% {opacity:0} 50% {opacity:1} 62.5% {opacity:0} 100% {opacity:0} }
    </style>
  </defs>

  <g stroke-linecap="square">
    <g stroke="#e6e0d6" stroke-width="1">
      <line x1="120" y1="16" x2="120" y2="80"/>
      <line x1="200" y1="16" x2="200" y2="80"/>
      <line x1="40" y1="48" x2="280" y2="48"/>
      <line x1="40" y1="16" x2="280" y2="16"/>
    </g>
    <g stroke="#d3cabd" stroke-width="1">
      <line x1="40" y1="80" x2="280" y2="80"/>
      <line x1="40" y1="16" x2="40" y2="80"/>
      <line x1="280" y1="16" x2="280" y2="80"/>
    </g>
  </g>

  <g stroke="#b3a795" stroke-width="1">
    <line x1="40" y1="84" x2="40" y2="88"/>
    <line x1="120" y1="84" x2="120" y2="88"/>
    <line x1="200" y1="84" x2="200" y2="88"/>
    <line x1="280" y1="84" x2="280" y2="88"/>
    <line x1="36" y1="80" x2="32" y2="80"/>
    <line x1="36" y1="48" x2="32" y2="48"/>
    <line x1="36" y1="16" x2="32" y2="16"/>
  </g>

  <text x="304" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"
        letter-spacing="2.6" fill="#b3a795">CURSOR</text>
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#8b4513" letter-spacing="1.5">
    <text class="k k0" x="304" y="58">( 0, 0 )</text>
    <text class="k k1" x="304" y="58">( 1, 0 )</text>
    <text class="k k2" x="304" y="58">( 1, 1 )</text>
    <text class="k k3" x="304" y="58">( 2, 1 )</text>
    <text class="k k4" x="304" y="58">( 2, 2 )</text>
  </g>

  <g class="cursor">
    <path d="M0 0 L0 16 L4.5 12 L7.4 18.8 L9.9 17.7 L7.0 11.1 L12 11.1 Z"
          fill="#ffffff" stroke="#2c2418" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
